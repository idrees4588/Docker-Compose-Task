<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Docker Compose Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Task Manager</h1>
            <p class="subtitle">Simple Frontend & Backend with Docker</p>
        </header>

        <div class="status-card">
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting to backend...</span>
            </div>
        </div>

        <div class="add-task-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a new task..." 
                autocomplete="off"
            >
            <button id="addTaskBtn" onclick="addTask()">Add Task</button>
        </div>

        <div class="tasks-container">
            <h2>Your Tasks</h2>
            <ul id="taskList" class="task-list">
                <!-- Tasks will be loaded here -->
            </ul>
        </div>
    </div>

    <footer>
        <p>Built with ❤️ using Docker Compose</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
